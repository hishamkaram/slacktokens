name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  lint:
    strategy:
      fail-fast: false
      matrix:
        # Lint each target so build-tagged files (cookie_darwin.go,
        # cookie_linux.go, cookie_windows.go, dpapi_windows.go) are all
        # exercised. golangci-lint only sees files that match the build
        # constraints of the current GOOS.
        goos: [linux, darwin, windows]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Scan the same toolchain used for release builds. An outdated
          # standard library is a real exposure, not a scanner false positive.
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: gosec
        uses: securego/gosec@master
        with:
          # G505 (crypto/sha1): Chromium's PBKDF2 mandates SHA-1; this is
          # interop, not our crypto choice. The decrypt path uses a fixed
          # IV (G407) by Chromium specification; the encrypt-with-fixed-IV
          # helper lives only in _test.go and gosec doesn't scan tests.
          args: -exclude=G505 ./...
