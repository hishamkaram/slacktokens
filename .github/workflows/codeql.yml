name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  analyze:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CodeQL (go, linux)
            language: go
            goos: linux
            build-mode: manual
          - name: CodeQL (go, darwin)
            language: go
            goos: darwin
            build-mode: manual
          - name: CodeQL (go, windows)
            language: go
            goos: windows
            build-mode: manual
          - name: CodeQL (actions)
            language: actions
            goos: linux
            build-mode: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Go
        if: matrix.language == 'go'
        run: CGO_ENABLED=0 go build ./...
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}/os:${{ matrix.goos }}
