name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  analyze:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CodeQL (go, linux)
            language: go
            goos: linux
            build-mode: manual
          - name: CodeQL (go, darwin)
            language: go
            goos: darwin
            build-mode: manual
          - name: CodeQL (go, windows)
            language: go
            goos: windows
            build-mode: manual
          - name: CodeQL (actions)
            language: actions
            goos: linux
            build-mode: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Go
        if: matrix.language == 'go'
        run: CGO_ENABLED=0 go build ./...
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}/os:${{ matrix.goos }}
