version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      go-patch-and-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"
  # Tool directives are represented as indirect requirements. Monitor them and
  # their dependencies explicitly without routinely bumping application indirects.
  # Three application PRs + two tools PRs keep the total Go version-update cap at five.
  - package-ecosystem: gomod
    directory: /.github/tools
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      security-tools-patch-and-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build(tools)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      actions-patch-and-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
